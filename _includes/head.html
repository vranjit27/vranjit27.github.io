{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function () {
    var root = document.documentElement;
    var toolbar = document.querySelector('meta[name="theme-color"]');

    function applyTheme(dark) {
      if (dark) root.setAttribute('data-theme', 'dark');
      else root.removeAttribute('data-theme');
      toolbar.content = dark ? '#222222' : '#ffffff';
    }

    function restoreTheme() {
      try {
        applyTheme(localStorage.getItem('theme') === 'dark');
      } catch (error) { /* Keep the current theme if storage is unavailable. */ }
    }

    restoreTheme();
    window.addEventListener('storage', function (event) {
      if (event.key === 'theme' || event.key === null) restoreTheme();
    });
    window.addEventListener('pageshow', function (event) {
      if (event.persisted) restoreTheme();
    });
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('theme-toggle').addEventListener('click', function () {
        var dark = root.getAttribute('data-theme') !== 'dark';
        applyTheme(dark);
        try {
          localStorage.setItem('theme', dark ? 'dark' : 'light');
        } catch (error) { /* Switching still works for this page. */ }
      });
    });
  })();
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css">

<meta http-equiv="cleartype" content="on">
